<style>
*{box-sizing:border-box}
:root{
--bg:#0a0d13;--panel:#141a25;--panel2:#1a2231;--line:#243044;--line2:#2f3d55;
--txt:#e8eef8;--dim:#9aa8bd;--dim2:#6d7b8f;

html,body{margin:0;padding:0}
body{
background:radial-gradient(1100px 520px at 50% -220px,#16233a 0%,rgba(10,13,19,0) 70%),var(--bg);
color:var(--txt);line-height:1.45;-webkit-text-size-adjust:100%;padding-bottom:26px;
font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",Roboto,"Helvetica Neue",sans-serif}
.wrap{max-width:1060px;margin:0 auto;padding:0 13px}
header{padding:16px 0 8px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:11px;flex:0 0 auto;background:linear-gradient(135deg,#3b82f6,#22d3ee);display:grid;place-items:center;font-weight:800;font-size:14px;color:#06121f}
h1{font-size:16.5px;margin:0;letter-spacing:.2px}
h1 span{color:var(--dim2);font-weight:500}
.sub{font-size:11px;color:var(--dim2);margin-top:2px}
.tag{margin-left:auto;font-size:10.5px;color:#8fd3ae;background:#10231a;border:1px solid #1e4632;border-radius:999px;padding:4px 9px;white-space:nowrap}
.search{margin:12px 0 10px}
.field{display:flex;gap:8px}
.field input{
flex:1 1 auto;min-width:0;background:var(--panel);border:1px solid var(--line2);color:var(--txt);
border-radius:12px;padding:13px 14px;font-size:16px;outline:none}
.field input::placeholder{color:var(--dim2)}
.field input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(91,141,255,.15)}
.iwrap{position:relative;flex:1 1 auto;min-width:0;display:block}
.iwrap input{width:100%;display:block}
.sug{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:40;background:var(--panel);
border:1px solid var(--line2);border-radius:12px;box-shadow:0 16px 34px rgba(0,0,0,.5);
overflow:hidden auto;max-height:52vh}
.sug[hidden]{display:none}
.sug-item{display:flex;align-items:baseline;gap:8px;width:100%;text-align:left;background:transparent;
border:0;padding:10px 12px;color:var(--txt);font-size:13.5px;border-bottom:1px solid rgba(36,48,68,.65)}
.sug-item:last-child{border-bottom:0}
.sug-item b{font-weight:700}
.sug-item .sc{color:var(--dim2);font-size:11.5px;font-variant-numeric:tabular-nums}
.sug-item .st{margin-left:auto;color:var(--dim2);font-size:11px;white-space:nowrap}
.sug-item.on,.sug-item:hover{background:#1e293b}
.sug .empty{padding:11px 12px;color:var(--dim2);font-size:12px}
button{font-family:inherit;cursor:pointer}
.go{flex:0 0 auto;border:0;border-radius:12px;padding:0 18px;font-size:14.5px;font-weight:700;color:#04101f;
background:linear-gradient(135deg,#69a2ff,#46d3f0)}
.go:disabled{opacity:.55;cursor:default}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.chip{background:var(--panel2);border:1px solid var(--line);color:#c5d3e6;border-radius:999px;padding:6px 11px;font-size:12.5px}
.chip:hover{border-color:var(--acc);color:#fff}
.rowbtn{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.ghost{background:var(--panel);border:1px solid var(--line2);color:#c9d6e8;border-radius:11px;padding:9px 13px;font-size:12.5px;font-weight:600}
.ghost:hover{border-color:var(--acc)}
.hint{font-size:11.5px;color:var(--dim2);margin-top:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);padding:14px}
.stack{display:grid;gap:10px;margin-top:10px}
.hero{position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--gc,#5b8dff),transparent 70%)}
.hero-top{display:flex;align-items:flex-start;gap:12px}
.nm{font-size:19px;font-weight:800;letter-spacing:-.2px}
.code{font-size:11.5px;color:var(--dim2);margin-left:6px;font-weight:500}
.dt{font-size:11.5px;color:var(--dim2);margin-top:3px}
.px{font-size:23px;font-weight:800;margin-top:7px;letter-spacing:-.4px}
.px small{font-size:11px;color:var(--dim2);font-weight:600;margin-left:6px}
.scorebox{margin-left:auto;text-align:center;flex:0 0 auto}
.ring{width:82px;height:82px;border-radius:50%;display:grid;place-items:center;position:relative;
background:conic-gradient(var(--gc,#94a3b8) calc(var(--p,0)*1%),#1f2a3d 0)}
.ring:before{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--panel)}
.ring b{position:relative;font-size:19px;letter-spacing:-.5px}
.scorebox span{display:block;font-size:10px;color:var(--dim2);margin-top:4px}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:9px;padding:6px 11px;font-size:13px;font-weight:800;letter-spacing:.3px;color:#08111c;background:var(--gc,#94a3b8);margin-top:10px}
.oneline{font-size:13px;color:#cfdcee;margin-top:9px;padding-top:9px;border-top:1px dashed var(--line2)}
.grid{display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr}}
@media(min-width:960px){.grid{grid-template-columns:repeat(6,1fr)}.grid .axis{grid-column:span 2}.grid .axis:nth-child(n+4){grid-column:span 3}}
.axis{background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);padding:13px}
.axis-h{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--dim)}
.axis-h .no{width:18px;height:18px;border-radius:6px;background:var(--panel2);border:1px solid var(--line2);display:grid;place-items:center;font-size:10.5px;color:#a9b8cc}
.axis-h .w{margin-left:auto;font-size:10.5px;color:var(--dim2)}
.axis-v{display:flex;align-items:baseline;gap:8px;margin-top:8px}
.big{font-size:21px;font-weight:800;letter-spacing:-.3px}
.vd{font-size:12px;font-weight:700;color:#c8d6e8;background:var(--panel2);border:1px solid var(--line2);border-radius:7px;padding:2px 7px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin-top:9px;font-size:12px}
.kv dt{color:var(--dim2)}
.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.bar{height:5px;border-radius:99px;background:#1f2a3d;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--gc,#5b8dff)}
.note{font-size:11.5px;color:var(--dim);margin-top:9px}
.pocline{font-size:11.5px;color:#c2d1e5;margin-top:7px;font-variant-numeric:tabular-nums}
.poclab{font-size:10px;color:var(--dim2);margin-top:1px;letter-spacing:.2px}
.bands-h{font-size:10.5px;color:var(--dim2);margin-top:11px;letter-spacing:.2px}
.bands-h span{color:#5d6b80}
.bands{display:grid;gap:7px;margin-top:6px}
.band .bt{display:flex;align-items:baseline;gap:6px;font-size:11.5px}
.band .bt b{font-size:12.5px;font-variant-numeric:tabular-nums}
.band .rk{flex:0 0 auto;width:14px;height:14px;border-radius:5px;background:var(--panel2);border:1px solid var(--line2);
color:#a9b8cc;font-size:9.5px;font-weight:700;font-style:normal;display:grid;place-items:center;align-self:center}
.band .sh{color:var(--dim);font-size:10.5px}
.band .dg{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
.band .bb{height:5px;border-radius:99px;background:#1f2a3d;overflow:hidden;margin-top:3px}
.band .bb i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#7c5cd6,#a78bfa)}
.band .br{font-size:9.5px;color:#5d6b80;margin-top:2px;font-variant-numeric:tabular-nums}
.band.in .bt b{color:#fff}
.band.in .bb i{background:linear-gradient(90deg,#16a34a,#4ade80)}
.mini{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pill{font-size:10.5px;border-radius:6px;padding:2px 7px;border:1px solid var(--line2);color:#b9c8dc;background:#151d29}
.pill.ok{color:#86e0a8;border-color:#1e4632;background:#0f2119}
.pill.no{color:#ffb0b4;border-color:#4a2226;background:#221114}
.pos{color:var(--pos)}.neg{color:var(--neg)}.mut{color:var(--dim2)}
.sec-h{display:flex;align-items:center;gap:8px;margin:18px 0 2px;font-size:13px;color:#c6d4e7;font-weight:700}
.sec-h:after{content:"";flex:1;height:1px;background:var(--line)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{color:var(--dim2);font-weight:600;text-align:left;padding:6px 4px;border-bottom:1px solid var(--line);font-size:11px}
td{padding:7px 4px;border-bottom:1px solid rgba(36,48,68,.6);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
td:last-child,th:last-child{text-align:right}
.lv{display:grid;gap:10px}
@media(min-width:700px){.lv{grid-template-columns:1fr 1fr}}
.lv h4{margin:0 0 4px;font-size:12px;color:var(--dim)}
.rp{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:9px}
.rp-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rp-h b{color:#e6eefb;font-size:12.5px}
.rp-h span{font-size:11px;color:var(--dim2)}
.rp-t{font-size:13px;font-weight:700;margin-top:5px;color:#dbe6f5;line-height:1.4;word-break:keep-all}
.rp-m{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:7px;font-size:11.5px;color:#b6c5da}
.rp-s{margin-top:7px;font-size:11.5px;color:#9fb0c8;line-height:1.55;word-break:keep-all}
.rp-l{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.rp-l a{font-size:11px;color:#8fb6ff;text-decoration:none;border:1px solid var(--line2);border-radius:7px;padding:4px 9px}
.rp-l a:hover{border-color:var(--acc)}
.fold{margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);overflow:hidden}
.fold summary{cursor:pointer;padding:12px 14px;font-size:12.5px;font-weight:700;color:#c3d2e6;list-style:none}
.fold summary::-webkit-details-marker{display:none}
.fold summary:after{content:"▾";float:right;color:var(--dim2)}
.fold[open] summary:after{content:"▴"}
.fold .body{padding:0 14px 13px;border-top:1px solid var(--line)}
.notes{font-size:12px;color:#b6c5da}
.notes p{margin:9px 0 0}
.notes b{color:#e6eefb;display:block;font-size:12px;margin-bottom:1px}
pre{margin:10px 0 0;white-space:pre-wrap;word-break:break-word;font-size:11.5px;line-height:1.6;color:#c2d1e5;
font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#0d121b;border:1px solid var(--line);border-radius:10px;padding:11px}
.tools{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.mini-btn{background:var(--panel2);border:1px solid var(--line2);color:#bccbdf;border-radius:8px;padding:6px 10px;font-size:11.5px}
.rec{display:grid;gap:8px;margin-top:9px}
@media(min-width:700px){.rec{grid-template-columns:repeat(3,1fr)}}
.rec-item{width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;color:inherit}
.rec-item:hover{border-color:var(--acc)}
.rec-item .rk{font-size:10.5px;color:var(--dim2);letter-spacing:.4px}
.rec-item .rnm{font-size:14px;font-weight:800;margin-top:3px}
.rec-item .rsc{font-size:11.5px;color:var(--dim);margin-top:5px;font-variant-numeric:tabular-nums}
.disc{font-size:11px;color:var(--dim2);line-height:1.6;margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.err{background:#221114;border:1px solid #4a2226;color:#ffb8bc;border-radius:12px;padding:12px;font-size:12.5px}
.err b{display:block;margin-bottom:3px;color:#ffd0d2}
.skel{color:var(--dim);
font-size:12.5px;display:flex;align-items:center;gap:8px}
.spin{width:13px;height:13px;border-radius:50%;border:2px solid #2b3a52;border-top-color:var(--acc);animation:sp .8s linear infinite;flex:0 0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
footer{text-align:center;font-size:10.5px;color:#4f5b6c;margin-top:18px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="brand">
    <div class="logo">QX</div>
    <div>
      <h1>QuantumX <span>PRO</span></h1>
      <div class="sub">매집·수급·모멘텀 기반 종합 리포트</div>
    </div>
    <div class="tag">조회 전용</div>
  </div>
</header>

<main>
  <section class="search">
    <form class="field" id="f" autocomplete="off">
      <div class="iwrap">
        <input id="q" type="text" inputmode="text" autocomplete="off" autocapitalize="characters"
               placeholder="종목명 또는 티커 (예: 삼성전자, TSLA)" aria-label="종목명 또는 티커"
               aria-autocomplete="list" aria-controls="sug">
        <div class="sug" id="sug" role="listbox" hidden></div>
      </div>
      <button class="go" id="go" type="submit">조회</button>
    </form>
    <div class="chips" id="chips"></div>
    <div class="rowbtn">
      <button class="ghost" id="recbtn" type="button">📊 오늘의 추천 TOP 3</button>
      <button class="ghost" id="api" type="button">API 안내</button>
    </div>
    <div class="hint">국내 종목명·6자리 코드·미국 티커 모두 조회됩니다. 첫 조회는 시세 수집에 몇 초 걸릴 수 있어요.</div>
  </section>

  <section id="recbox"></section>
  <section id="out"></section>
</main>

<footer>
  QuantumX PRO · 과거 시세·수급 기반 기술적 계산 · 주문 기능 없음
</footer>
</div>

<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s)};
var CHIPS=["삼성전자","이지홀딩스","SK하이닉스","한화엔진","TSLA","AAPL"];
var NAMES={"005930":"삼성전자","000270":"기아","035720":"카카오","373220":"LG에너지솔루션","068270":"셀트리온","042660":"한화오션",
"000660":"SK하이닉스","082740":"한화엔진","035810":"이지홀딩스"};
var GC={"STRONG_BUY":"#16a34a","ADD":"#0ea5e9","HOLD":"#94a3b8","REDUCE":"#f5a524","SELL":"#ef4444"};

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function num(v,nd){if(v==null||v===""||isNaN(v))return "-";
  var n=Number(v);return n.toLocaleString("ko-KR",{minimumFractionDigits:0,maximumFractionDigits:(nd==null?2:nd)});}
function price(v,cur){if(v==null||isNaN(v))return "-";
  return cur==="USD"?"$"+Number(v).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})
                      :Math.round(Number(v)).toLocaleString("ko-KR")+"원";}
function pct(v,nd){if(v==null||v===""||isNaN(v))return "-";
  var n=Number(v);return (n>0?"+":"")+n.toFixed(nd==null?2:nd)+"%";}
function qty(v){if(v==null||isNaN(v))return "-";
  var n=Number(v);return (n>0?"+":"")+(n===0?"0":n.toLocaleString("ko-KR"))+"주";}
function cls(v){if(v==null||isNaN(v)||Number(v)===0)return "mut";return Number(v)>0?"pos":"neg";}
function gradeCls(g){return GC[g]||"#94a3b8";}

/* ---------- chips ---------- */
var chipBox=$("#chips");
CHIPS.forEach(function(name){
  var b=document.createElement("button");
  b.type="button";b.className="chip";b.textContent=name;
  b.addEventListener("click",function(){$("#q").value=name;lookup(name);});
  chipBox.appendChild(b);
});

/* ---------- state helpers ---------- */
function busy(on,txt){
  var go=$("#go"); go.disabled=on; go.textContent=on?"조회중":"조회";
  if(on){ $("#out").innerHTML='<div class="card skel"><span class="spin"></span>'+
    esc(txt||"시세·수급을 불러와 리포트를 계산하는 중…")+'</div>'; }
}
function fail(title,detail,extra){
  busy(false);
  $("#out").innerHTML='<div class="err"><b>'+esc(title||"조회 실패")+'</b>'+
    (detail?'<div>'+esc(detail)+'</div>':'')+
    (extra?'<div style="margin-top:6px;color:#e3a6a9;font-size:11.5px">'+esc(extra)+'</div>':'')+'</div>';
}

/* ---------- lookup ---------- */
function lookup(name){
  name=(name||"").trim();
  if(!name){ $("#q").focus(); return; }
  $("#q").value=name;
  hideSug();
  var t0=Date.now();
  busy(true,"‘"+name+"’ 리포트를 계산하는 중… (시세·수급 수집)");
  fetch("/report",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({stock_name:name})})
  .then(function(r){return r.json().catch(function(){return null;}).then(function(j){return {ok:r.ok,status:r.status,data:j};});})
  .then(function(res){
    var d=res.data;
    if(!res.ok||!d||d.error){
      fail((d&&d.error)||("HTTP "+res.status+" 응답을 받지 못했습니다"),
           (d&&(d["원인"]||d["힌트"]||"")), (d&&d["힌트"]&&d["원인"])?d["힌트"]:"");
      return;
    }
    render(d,Date.now()-t0);
  })
  .catch(function(e){ fail("네트워크 오류","서버에 연결하지 못했습니다. 잠시 후 다시 시도해 주세요.",e&&e.message); });
}

$("#f").addEventListener("submit",function(ev){ev.preventDefault();lookup($("#q").value);});

/* ---------- 연관검색어 드롭다운 ---------- */
var sugBox=$("#sug"), qInput=$("#q");
var sugTimer=null, sugItems=[], sugIdx=-1, sugSeq=0;
function hideSug(){ sugBox.hidden=true; sugBox.innerHTML=""; sugItems=[]; sugIdx=-1; }
function markSug(){
  Array.prototype.forEach.call(sugBox.children,function(el,i){ el.classList.toggle("on", i===sugIdx); });
}
function pickSug(i){
  var it=sugItems[i]; if(!it) return;
  hideSug(); qInput.value=it.name; lookup(it.name);
}
function renderSug(items){
  sugItems=items; sugIdx=-1;
  if(!items.length){ sugBox.innerHTML='<div class="empty">검색 결과가 없습니다</div>'; sugBox.hidden=false; return; }
  var h="";
  items.forEach(function(it,i){
    h+='<button type="button" class="sug-item" data-i="'+i+'" role="option">'+
       '<b>'+esc(it.name)+'</b><span class="sc">'+esc(it.code)+'</span>'+
       '<span class="st">'+esc(it.typeName||"")+'</span></button>';
  });
  sugBox.innerHTML=h; sugBox.hidden=false;
  Array.prototype.forEach.call(sugBox.querySelectorAll(".sug-item"),function(b){
    b.addEventListener("mousedown",function(ev){ ev.preventDefault(); });
    b.addEventListener("click",function(){ pickSug(Number(b.getAttribute("data-i"))); });
  });
}
function fetchSug(q){
  var seq=++sugSeq;
  fetch("/search?q="+encodeURIComponent(q)).then(function(r){return r.json();}).then(function(d){
    if(seq!==sugSeq || qInput.value.trim()!==q) return;
    renderSug((d&&d.items)||[]);
  }).catch(function(){ });
}
qInput.addEventListener("input",function(){
  var q=qInput.value.trim();
  clearTimeout(sugTimer);
  if(!q){ hideSug(); return; }
  sugTimer=setTimeout(function(){ fetchSug(q); },200);
});
qInput.addEventListener("keydown",function(ev){
  if(sugBox.hidden) return;
  if(ev.key==="ArrowDown"||ev.key==="ArrowUp"){
    if(!sugItems.length) return;
    ev.preventDefault();
    sugIdx = ev.key==="ArrowDown" ? (sugIdx+1)%sugItems.length
                                   : (sugIdx<=0 ? sugItems.length-1 : sugIdx-1);
    markSug();
  } else if(ev.key==="Enter"){
    if(sugIdx>=0){ ev.preventDefault(); pickSug(sugIdx); }
  } else if(ev.key==="Escape"){ hideSug(); }
});
qInput.addEventListener("blur",function(){ setTimeout(hideSug,120); });

  var rep=d["summary_report"]||"";

  h+='<div class="stack">'+cards+lv+lvInfo+rsec+fold+repFold+
     '<div class="card" style="font-size:11.5px;color:#7f8da1">※ 과거 시세·수급 기반 기술적 계산이며 투자자문이 아닙니다. 조회 전용(주문·매매 기능 없음).</div>'+
     '</div>';

  $("#out").innerHTML=h;
  busy(false);
  var cp=$("#cp");
  if(cp) cp.addEventListener("click",function(){
    var txt=(d["종목명"]||"")+" "+g+" "+num(sc,1)+"/100\n"+(d["한줄요약"]||"")+"\n\n"+rep;
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){cp.textContent="✅ 복사됨";
        setTimeout(function(){cp.textContent="📋 요약 복사";},1500);});
    }else{ cp.textContent="복사 미지원"; }
  });
  try{ window.scrollTo({top:0,behavior:"smooth"}); }catch(e){}
}

/* ---------- first load ---------- */
lookup("삼성전자");
})();
</script>
